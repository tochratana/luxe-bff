name: luxe-bff

services:
  bff:
    image: ${BFF_IMAGE:?Set BFF_IMAGE}
    container_name: luxe-bff
    restart: unless-stopped
    environment:
      BFF_PORT: "16801"
      LUXE_API_URL: ${LUXE_API_URL:-http://luxe-api:16800}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?Set KEYCLOAK_ISSUER_URI}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?Set KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-luxe-admin}
      LUXE_UI_URL: https://www.luxe-kh.online/
      LUXE_ADMIN_PUBLIC_URL: ${LUXE_ADMIN_PUBLIC_URL:-https://admin.luxe-kh.online/}
      OAUTH2_ADMIN_REDIRECT_URI: ${OAUTH2_ADMIN_REDIRECT_URI:-https://admin.luxe-kh.online/bff/login/oauth2/code/keycloak-admin}
    expose:
      - "16801"
    networks:
      - luxe-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  luxe-net:
    external: true
