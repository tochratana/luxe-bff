server:
  port: ${BFF_PORT:16801}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: luxe-bff
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.luxe-kh.online/realms/luxe}
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:luxe-ui}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:BjkBavtwH7UGEycvstmaI1MCoTbzEwpr}
            client-authentication-method: client_secret_post
            redirect-uri: ${OAUTH2_REDIRECT_URI:https://www.luxe-kh.online/bff/login/oauth2/code/keycloak}
            scope:
              - openid
              - profile
              - email
              - roles
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: luxe-api
              uri: ${LUXE_API_URL:http://localhost:16800}
              predicates:
                - Path=/luxe-api/**
              filters:
                - RewritePath=/luxe-api/?(?<segment>.*), /$\{segment}
                - TokenRelay=
            - id: luxe-admin
              uri: ${LUXE_ADMIN_URL:http://localhost:3001}
              predicates:
                - Host=${LUXE_ADMIN_HOST_PATTERN:admin.localhost:*}
                - Path=/**
            - id: luxe-ui
              uri: ${LUXE_UI_URL:http://localhost:3000}
              predicates:
                - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: DEBUG
