spring:
  config:
    activate:
      on-profile: prod

  # The production UI and Admin remain on Vercel. Their same-origin rewrites
  # send only /luxe-api/** requests to this gateway.
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: luxe-api
              uri: ${LUXE_API_URL:http://luxe-api:16800}
              predicates:
                - Path=/luxe-api/**
              filters:
                - RewritePath=/luxe-api/?(?<segment>.*), /$\{segment}

  lifecycle:
    timeout-per-shutdown-phase: 20s
